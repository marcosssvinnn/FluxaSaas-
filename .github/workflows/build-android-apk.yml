name: Build Android APK

# Compila um .apk instalável (fora da Play Store) empacotando o MESMO
# index.html/app.js/styles.css do PWA via Capacitor — sem fork de código,
# sem build step novo pro resto do projeto (mesma filosofia do repo).
# O ambiente que gerou este workflow não tinha Node/Android SDK locais —
# roda tudo aqui no runner do GitHub, que já vem com o necessário.

on:
  push:
    branches: [ android-apk ]
  workflow_dispatch: {}

permissions:
  contents: write # necessário pra publicar o .apk como Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências do Capacitor
        run: npm install

      - name: Montar www/ (cópia dos arquivos que já rodam no PWA, gerada a cada build — nada disso é commitado)
        run: |
          mkdir -p www
          cp index.html app.js styles.css manifest.json native.js sw.js www/
          cp -r icons www/icons
          cp -r libs www/libs

      - name: Gerar o projeto nativo Android (não fica commitado no repo)
        run: npx cap add android

      - name: Aplicar o ícone real da Forthemp (android-assets/icon-forthemp-1024.png)
        run: |
          set -e
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          SRC=android-assets/icon-forthemp-1024.png
          declare -A SIZES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for density in "${!SIZES[@]}"; do
            size=${SIZES[$density]}
            dir="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            convert "$SRC" -resize "${size}x${size}" "$dir/ic_launcher.png"
            convert "$SRC" -resize "${size}x${size}" "$dir/ic_launcher_round.png"
            convert "$SRC" -resize "${size}x${size}" "$dir/ic_launcher_foreground.png"
          done
          # O template padrão do Capacitor/Android Studio define o ícone via
          # "adaptive icon" (mipmap-anydpi-v26/ic_launcher.xml, Android 8+) —
          # esse XML tem PRIORIDADE sobre os .png acima em qualquer aparelho
          # moderno, e normalmente aponta pra um drawable vetorial genérico
          # (não pros .png por densidade que acabamos de sobrescrever). É
          # exactly isso que fazia o ícone continuar mostrando o "F" genérico
          # mesmo com os .png certos no lugar. Remove o XML adaptativo (e
          # qualquer vetor de fundo/frente que ele referencie) pra forçar o
          # Android a cair nos .png por densidade, que aí sim são os nossos.
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/drawable*/ic_launcher_background.xml
          rm -f android/app/src/main/res/drawable*/ic_launcher_foreground.xml
          rm -f android/app/src/main/res/values/ic_launcher_background.xml

      - name: Sincronizar assets web pro projeto Android
        run: npx cap sync android

      - name: Restaurar keystore de debug estável entre builds (permite atualizar o app já instalado, sem precisar desinstalar)
        id: cache-keystore
        uses: actions/cache/restore@v4
        with:
          # Caminho absoluto, não `~` — achado num teste real (comparando o
          # certificado de assinatura de 2 builds seguidos via openssl): o
          # `cache-hit` dava true, mas o keystore restaurado não aparecia no
          # caminho que o step de baixo checava, e regenerava de qualquer
          # jeito. `~` é expandido pelo Node da action e pelo bash de formas
          # que podem não bater 100% — caminho absoluto elimina a ambiguidade.
          # Chave nova (v2) porque chave de cache é imutável: a v1 já tinha
          # uma entrada "presa" de alguma tentativa anterior, bloqueando
          # qualquer save novo silenciosamente (save cai em "skipped").
          path: /home/runner/.android/debug.keystore
          key: android-debug-keystore-v2

      - name: DIAGNÓSTICO — o que o restore realmente deixou em disco
        run: |
          {
            echo "cache-hit output: '${{ steps.cache-keystore.outputs.cache-hit }}'"
            echo "cache-primary-key: '${{ steps.cache-keystore.outputs.cache-primary-key }}'"
            echo "cache-matched-key: '${{ steps.cache-keystore.outputs.cache-matched-key }}'"
            echo "HOME=$HOME  whoami=$(whoami)  runner.os=${{ runner.os }}"
            echo "--- ls /home/runner/.android/ ---"
            ls -la /home/runner/.android/ 2>&1 || echo "(pasta /home/runner/.android não existe)"
            echo "--- ls \$HOME/.android/ ---"
            ls -la "$HOME/.android/" 2>&1 || echo "(pasta \$HOME/.android não existe)"
            if [ -f /home/runner/.android/debug.keystore ]; then
              echo "ARQUIVO EXISTE em /home/runner/.android/debug.keystore, tamanho: $(stat -c%s /home/runner/.android/debug.keystore 2>/dev/null || stat -f%z /home/runner/.android/debug.keystore)"
            else
              echo "ARQUIVO NÃO EXISTE em /home/runner/.android/debug.keystore"
            fi
          } | tee diag-keystore.txt

      - name: Gerar o keystore de debug só na 1ª vez (fica em cache pras próximas)
        run: |
          set -e
          mkdir -p /home/runner/.android
          if [ ! -f /home/runner/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore /home/runner/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Salvar o keystore de debug no cache (só quando foi gerado agora, não quando veio do cache)
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: android-debug-keystore-v2

      - name: Compilar o APK (debug — sem keystore, pronto pra instalar direto)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear o APK gerado
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Forthemp.apk

      - name: Subir como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: forthemp-android-apk
          path: Forthemp.apk

      - name: Montar notas do Release (inclui o diagnóstico do keystore — lido sem precisar de login no Actions)
        run: |
          {
            echo "APK gerado automaticamente pelo GitHub Actions a partir do commit ${{ github.sha }}."
            echo "Baixe \`Forthemp.apk\` abaixo e instale direto no aparelho (é preciso permitir \"instalar de fontes desconhecidas\" no Android, já que não vem da Play Store)."
            echo ""
            echo "### Diagnóstico do keystore (temporário, pra depurar o cache)"
            echo '```'
            cat diag-keystore.txt
            echo '```'
          } > release-notes.txt

      - name: Publicar/atualizar Release com o .apk (link fixo pra baixar)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: forthemp-android-latest
          name: Forthemp — App Android (build automático)
          body_path: release-notes.txt
          files: Forthemp.apk
          make_latest: false
